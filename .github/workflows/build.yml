name: Build Azzuill IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Select Xcode 16
      run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

    - name: Build iOS App (.app)
      run: |
        cd Azzuill
        xcodebuild \
          -project Azzuill.xcodeproj \
          -scheme Azzuill \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath derived_data \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          clean build

    - name: Package IPA
      run: |
        APP_PATH=$(find Azzuill/derived_data -name "Azzuill.app" | head -1)
        echo "Found app at: $APP_PATH"
        
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r Azzuill.ipa Payload
        
        ls -lh Azzuill.ipa

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Azzuill-IPA
        path: Azzuill.ipa
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "Azzuill Free Fire VIP v1.0.${{ github.run_number }}"
        body: |
          ## 🎮 Azzuill - Free Fire VIP Optimizer (OB54)
          
          ### 📱 Hướng dẫn cài đặt trên iPhone bằng Esign:
          1. Tải file **`Azzuill.ipa`** bên dưới.
          2. Mở ứng dụng **Esign** trên iPhone.
          3. Chọn **Nhập tệp (Import)** -> Chọn `Azzuill.ipa`.
          4. Bấm **Ký (Signature)** -> Chọn chứng chỉ của bạn -> Bấm **Ký ứng dụng**.
          5. Bấm **Cài đặt (Install)**.
          6. Mở app **Azzuill** và tận hưởng! 🎉
          
          ---
          *Build tự động bởi Xcode 16 trên macOS chuẩn 100% không lỗi!*
        files: Azzuill.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
